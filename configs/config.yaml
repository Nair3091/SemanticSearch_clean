# Central config — edit here, not hardcoded in modules.
# Anyone changing a default should update this file so the whole team stays in sync.

query_understanding:
  # 4-bit Qwen3-1.7B through llama.cpp: ~13x faster than fp32 on CPU with the same or better parses
  # (scripts/bench_qwen_backends.py). Falls back to "Qwen/Qwen3-1.7B" (fp32) if the file or
  # llama-cpp-python is missing. Get it: unsloth/Qwen3-1.7B-GGUF, Qwen3-1.7B-Q4_K_M.gguf
  qwen3_model_name: "data/models/Qwen3-1.7B-Q4_K_M.gguf"
  max_sub_queries: 5

vision_retrieval:
  clip_model_name: "openai/clip-vit-large-patch14"
  pass1_interval_seconds: 2.0
  pass2_interval_seconds: 0.25
  top_k_windows: 5
  faiss_index_path: "data/faiss_index/index.faiss"
  window_radius_seconds: 3.0
  softmax_logit_scale: 100.0   # CLIP's own temperature; used for the softmax confidence
  # A query naming a colour ("a man in a red shirt") is only confident on frames where that colour
  # ranks in the top N of 12 colours for the same phrase; 0 turns the check off. From one clip:
  # wrong colours ranked 6-12, right ones 1-3. Still to calibrate on more videos.
  attribute_max_rank: 3
  # Videos up to this long get every Pass-2 frame embedded up front (on upload, or while Qwen runs),
  # so later queries only score frames. Longer videos get Pass 1 up front and Pass 2 per query.
  preindex_full_max_seconds: 60

fusion_confidence:
  aggregation: "min"
  # Accept/reject uses "softmax" (the query against 80 COCO distractors, 0 to 1) or "raw" cosine.
  # Raw cosine is always what locates the moment.
  confidence_score: "softmax"
  # Softmax. From one test video: real matches 0.21-0.997, absent concepts up to 0.056, so this
  # sits in the middle of the gap. Still to calibrate against the NegBench/QVHighlights dev set.
  confidence_threshold: 0.15
  # Raw ViT-L/14 cosine, used only when confidence_score is "raw". From the same video:
  # real matches from 0.18, absent up to 0.17, so this margin is small.
  raw_confidence_threshold: 0.185
  segment_score_drop: 0.02     # segment = frames around a peak within this much of it; not calibrated
  negation:
    conclip_weights_path: "data/conclip/conclip_b32_openclip_version.pt"   # gitignored, from NegBench
    conclip_model_name: "ViT-B-32"
    # A frame passes if its similarity to the excluded concept is below this. From one test video:
    # absent up to 0.195, visible from 0.215. Still to calibrate on a proper dev set.
    frame_threshold: 0.205
    min_pass_ratio: 0.7
    sample_interval_seconds: 1.0
    max_frames_per_segment: 16
    batch_size: 16
    fusion_weight: 0.5         # placeholder, weight of the ConCLIP score in the final ranking

recovery:
  max_retries: 1
  threshold_relax_step: 0.05
  window_widen_factor: 1.5

hardware:
  # "auto": CLIP and ConCLIP use an NVIDIA GPU when PyTorch has CUDA, otherwise the CPU.
  # "cpu" forces the CPU. Needs the CUDA build of PyTorch (see requirements.txt).
  device: "auto"
  # Layers of the 4-bit Qwen to put on the GPU: -1 = all, 0 = none (CPU only). Ignored by the
  # CPU-only build of llama-cpp-python; if loading on the GPU fails, Qwen falls back to the CPU.
  qwen_gpu_layers: -1
